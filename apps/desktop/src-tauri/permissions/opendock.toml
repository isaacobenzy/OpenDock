# Per-command `allow-*` permissions are generated from the list in build.rs.
# These sets group them by what each window needs.

[[set]]
identifier = "dock-core"
description = "Read and save settings and lay out the dock."
permissions = [
  "allow-get-settings",
  "allow-save-settings",
  "allow-apply-dock-layout-command",
  "allow-set-dock-length",
  "allow-get-current-monitor-id",
]

[[set]]
identifier = "widget-read"
description = "Read local widget data: media, system stats, focus, todos, notes, weather and calendar events."
permissions = [
  "allow-get-media-state",
  "allow-get-system-stats",
  "allow-get-focus-state",
  "allow-list-todos",
  "allow-list-notes",
  "allow-get-weather",
  "allow-upcoming-events",
  "allow-list-calendars",
]

[[set]]
identifier = "widget-control"
description = "Act on widgets: media keys, Start, focus rounds, todos, notes and refreshes."
permissions = [
  "allow-media-control",
  "allow-open-start-menu",
  "allow-focus-start",
  "allow-focus-stop",
  "allow-add-todo",
  "allow-set-todo-done",
  "allow-rename-todo",
  "allow-delete-todo",
  "allow-clear-done-todos",
  "allow-create-note",
  "allow-update-note",
  "allow-pin-note",
  "allow-delete-note",
  "allow-refresh-weather",
  "allow-sync-calendars",
]

[[set]]
identifier = "widget-config"
description = "Configure widgets and the shell: city search, calendar feeds, startup, taskbar status and quitting."
permissions = [
  "allow-search-city",
  "allow-add-calendar",
  "allow-remove-calendar",
  "allow-set-launch-at-startup",
  "allow-get-taskbar-status",
  "allow-quit-app",
]

[[set]]
identifier = "automation"
description = "Manage rules, the activity log and the privacy ledger."
permissions = [
  "allow-list-rules",
  "allow-list-recipes",
  "allow-save-rule",
  "allow-set-rule-enabled",
  "allow-delete-rule",
  "allow-dry-run-rule",
  "allow-list-activity",
  "allow-undo-activity",
  "allow-clear-activity",
  "allow-get-privacy-ledger",
]

[[set]]
identifier = "apps-read"
description = "See open windows, installed apps, their icons and the volume."
permissions = [
  "allow-list-windows",
  "allow-get-app-icon",
  "allow-list-installed-apps",
  "allow-get-volume",
]

[[set]]
identifier = "apps-control"
description = "Switch, minimise and close windows, start pinned or installed apps, change the volume and press shell shortcuts."
permissions = [
  "allow-window-action",
  "allow-launch-app",
  "allow-set-volume",
  "allow-set-muted",
  "allow-send-shortcut",
]

[[set]]
identifier = "apps-setup"
description = "Import the apps pinned to the Windows taskbar."
permissions = ["allow-list-taskbar-pins"]

[[set]]
identifier = "previews"
description = "Draw live window previews inside a panel."
permissions = ["allow-show-thumbnails", "allow-clear-thumbnails"]

[[set]]
identifier = "power"
description = "Lock, sleep, sign out, restart or shut down from the launcher."
permissions = ["allow-power-action"]

[[set]]
identifier = "navigation"
description = "Open the hub and widget panels."
permissions = ["allow-open-hub", "allow-show-flyout", "allow-hide-flyout"]

[[set]]
identifier = "hub-window"
description = "Commands only the hub window uses."
permissions = ["allow-get-hub-page"]

[[set]]
identifier = "flyout-window"
description = "Commands only the widget panel uses."
permissions = ["allow-get-flyout-request", "allow-resize-flyout", "allow-hide-flyout", "allow-quit-app"]

[[set]]
identifier = "toast-window"
description = "Commands only the notification strip uses."
permissions = ["allow-take-pending-toasts", "allow-hide-toast", "allow-undo-activity"]
