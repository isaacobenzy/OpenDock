# Builds the Windows installers from a release tag on a clean runner and
# attaches them, with checksums, to an existing draft release.
# See docs/releasing.md for the full process.
name: Release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.3.0. A draft release with this tag must exist.
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check the tag format
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$env:TAG' is not a version tag" }

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          pnpm test
          pnpm test:rust

      - name: Build installers
        run: pnpm bundle:desktop

      - name: Collect artifacts and checksums
        shell: pwsh
        run: ./scripts/collect-release.ps1 -OutDir release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opendock-${{ inputs.tag }}-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Attach to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload $env:TAG (Get-ChildItem release -File).FullName --clobber
