name: Release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag of an existing draft release
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate release tag and draft
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Check installer version matches tag
        env:
          TAG: ${{ inputs.tag }}
        run: node -e "const c=require('./apps/desktop/src-tauri/tauri.conf.json'); if ('v'+c.version !== process.env.TAG) throw Error('Tag does not match installer version')"
  packages:
    needs: validate
    uses: ./.github/workflows/desktop-packages.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
  attach:
    needs: packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Download Windows and Linux build artifacts
        run: |
          gh run download "$RUN_ID" --name opendock-windows-x64 --dir artifacts/windows
          gh run download "$RUN_ID" --name opendock-linux-x64 --dir artifacts/linux
      - name: Verify checksums
        run: |
          (cd artifacts/windows && sha256sum -c SHA256SUMS-windows-x64.txt)
          (cd artifacts/linux && sha256sum -c SHA256SUMS-linux-x64.txt)
      - name: Attach complete package set to draft
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" artifacts/windows/* artifacts/linux/*
