name: Desktop packages

on:
  push:
    branches: [main, staging, develop, feat/combined-desktop-release]
  pull_request:
    branches: [main, staging, develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build
        type: string
        default: ''

permissions:
  contents: read

jobs:
  packages:
    name: Packages (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            bundles: nsis,msi
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check package collector
        run: node --test scripts/collect-packages.test.mjs
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test
      - name: Rust format
        run: pnpm fmt:check
      - name: Rust lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust tests
        run: pnpm test:rust
      - name: Build native packages
        run: pnpm --filter @opendock/desktop tauri build --bundles ${{ matrix.bundles }} -- --locked
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Collect packages and checksums
        run: node scripts/collect-packages.mjs ${{ matrix.platform }}
      - name: Inspect Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info release/linux-x64/*.deb
          rpm -qip release/linux-x64/*.rpm
          rpm -qp --requires release/linux-x64/*.rpm
          cd release/linux-x64
          sha256sum -c SHA256SUMS-linux-x64.txt
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: opendock-${{ matrix.platform }}
          path: release/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14
